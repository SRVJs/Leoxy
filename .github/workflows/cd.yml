name: CD

on:
  workflow_call:

env:
  PROJECT_NAME: "leoxy"
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOKCER_USERNAME }}
  DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check DockerHub credentials
        id: check-dockerhub
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_ACCESS_TOKEN" ]; then
            echo "DockerHub credentials found - will push image"
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "No DockerHub credentials - will build only (no push)"
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to DockerHub
        if: steps.check-dockerhub.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ steps.check-dockerhub.outputs.push }}
          tags: |
            ${{ steps.check-dockerhub.outputs.push == 'true' && format('{0}/{1}:latest', env.DOCKER_USERNAME, env.PROJECT_NAME) || format('{0}:local', env.PROJECT_NAME) }}
            ${{ steps.check-dockerhub.outputs.push == 'true' && format('{0}/{1}:{2}', env.DOCKER_USERNAME, env.PROJECT_NAME, github.sha) || format('{0}:{1}', env.PROJECT_NAME, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Push to DockerHub**: ${{ steps.check-dockerhub.outputs.push == 'true' && 'Yes' || 'No (credentials not configured)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-dockerhub.outputs.push }}" == "true" ]; then
            echo "- **Image Tags**: \`$DOCKER_USERNAME/$PROJECT_NAME:latest\`, \`$DOCKER_USERNAME/$PROJECT_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image Tag**: \`$PROJECT_NAME:local\`, \`$PROJECT_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
