name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...
  build:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/lx-2/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Image summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build image successfully" >> $GITHUB_STEP_SUMMARY

  compose:
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f ./docker/lx-2/docker-compose.yml config --quiet

      - name: Build Compose services
        run: docker compose -f ./docker/lx-2/docker-compose.yml build

      - name: Build Compose summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Compose Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build compose successfully" >> $GITHUB_STEP_SUMMARY

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/docker.yml
    secrets: inherit
