name: Docker

on:
  workflow_call:

env:
  PROJECT_NAME: "leoxy"
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOKCER_USERNAME }}
  DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/lx-2/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Image summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build image successfully" >> $GITHUB_STEP_SUMMARY

  compose:
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f ./docker/lx-2/docker-compose.yml config --quiet

      - name: Build Compose services
        run: docker compose -f ./docker/lx-2/docker-compose.yml build

      - name: Build Compose summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Compose Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed build compose successfully" >> $GITHUB_STEP_SUMMARY

  push:
    runs-on: ubuntu-latest
    needs: [image, compose]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read image version
        id: image-version
        run: |
          version=$(jq -r '.version' version.json)
          previous_version=$(git show "${GITHUB_SHA}^:version.json" 2>/dev/null | jq -r '.version' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$previous_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check DockerHub credentials
        id: check-dockerhub
        run: |
          if [ "${{ steps.image-version.outputs.changed }}" != "true" ]; then
            echo "Image version unchanged - will build only (no push)"
            echo "push=false" >> $GITHUB_OUTPUT
            echo "reason=Image version unchanged" >> $GITHUB_OUTPUT
          elif [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_ACCESS_TOKEN" ]; then
            echo "DockerHub credentials found - will push image"
            echo "push=true" >> $GITHUB_OUTPUT
            echo "reason=Push enabled" >> $GITHUB_OUTPUT
          else
            echo "No DockerHub credentials - will build only (no push)"
            echo "push=false" >> $GITHUB_OUTPUT
            echo "reason=credentials not configured" >> $GITHUB_OUTPUT
          fi

      - name: Log in to DockerHub
        if: steps.check-dockerhub.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/lx-2/Dockerfile
          push: ${{ steps.check-dockerhub.outputs.push }}
          load: ${{ steps.check-dockerhub.outputs.push != 'true' }}
          tags: |
            ${{ steps.check-dockerhub.outputs.push == 'true' && format('{0}/{1}:latest', env.DOCKER_USERNAME, env.PROJECT_NAME) || format('{0}:local', env.PROJECT_NAME) }}
            ${{ steps.check-dockerhub.outputs.push == 'true' && format('{0}/{1}:{2}', env.DOCKER_USERNAME, env.PROJECT_NAME, steps.image-version.outputs.version) || format('{0}:{1}', env.PROJECT_NAME, steps.image-version.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build summary
        run: |
          echo "# . 🦐 elrefai99 projects ." >> $GITHUB_STEP_SUMMARY
          echo "## 🐳 Docker Hub Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Push to DockerHub**: ${{ steps.check-dockerhub.outputs.push == 'true' && 'Yes' || format('No ({0})', steps.check-dockerhub.outputs.reason) }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-dockerhub.outputs.push }}" == "true" ]; then
            echo "- **Image Tags**: \`$DOCKER_USERNAME/$PROJECT_NAME:latest\`, \`$DOCKER_USERNAME/$PROJECT_NAME:${{ github.sha }}\`, \`$DOCKER_USERNAME/$PROJECT_NAME:${{ steps.image-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Image Tags**: \`$PROJECT_NAME:local\`, \`$PROJECT_NAME:${{ github.sha }}\`, \`$PROJECT_NAME:${{ steps.image-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          fi
