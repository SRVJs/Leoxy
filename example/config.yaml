server:
  host: "127.0.0.1"
  port: "4444"

  security:
    rate_limit: 100
    rate_limit_burst: 20
    global_rate_limit: 1000
    global_rate_burst: 100
    max_body: 10
    allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    trusted_proxy_cidrs: []
    internal_cidrs: []

upstream:
  - name: "Backend"
    path: /api
    ip: true
    body: 10
    servers:
      - "http://localhost:60459"
      - "http://localhost:60460"
    security:
      route_rate_limit: 100
      route_rate_burst: 20

  - name: "Frontend"
    path: /
    server_url: "http://localhost:3000"

  - name: "TCPService"
    protocol: tcp
    listen: ":7001"
    server_url: "127.0.0.1:7000"
    security:
      allow_cidrs: ["10.0.0.0/8"]
      max_conns_per_ip: 20

  - name: "UDPService"
    protocol: udp
    listen: ":7002"
    server_url: "127.0.0.1:7003"
    security:
      allow_cidrs: ["10.0.0.0/8"]
      max_conns_per_ip: 20
