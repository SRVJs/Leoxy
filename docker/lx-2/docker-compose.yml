services:
  leoxy:
    build:
      context: ../..
      dockerfile: docker/lx-2/Dockerfile

    image: ghcr.io/mohamed0699/leoxy:latest
    restart: unless-stopped
    init: true

    ports:
      - "${LEOXY_PORT:-4444}:4444"

    environment:
      PORT: 4444

    volumes:
      - ./leoxy:/app/leoxy

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:4444/health/live
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    stop_grace_period: 10s
